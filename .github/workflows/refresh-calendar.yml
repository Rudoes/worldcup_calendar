name: Refresh Calendar Feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-calendar-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - name: Commit regenerated feed
        run: |
          if git diff --quiet -- data/fifa-2026-matches.json docs/worldcup-2026.ics; then
            echo "No calendar changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fifa-2026-matches.json docs/worldcup-2026.ics
          git commit -m "Refresh World Cup calendar feed"
          git push
